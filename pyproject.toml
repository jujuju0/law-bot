[project]
name = "rag-minipjt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "kiwipiepy>=0.24.0",
    "langchain-openai>=1.6.7",
    "langchain-qdrant>=1.1.0",
    "lxml>=6.1.3",
    "openai>=3.26.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "app", "rag", "eval"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]
